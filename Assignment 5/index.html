<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Trouble With Bears</title>
    <!--
    Name:Kavya Panchal
    File: Assignment 2 part 1
    Date:1st JUNE 2026
    Description: Adding features to bouncing balls
    -->

    <!-- Fonts similar to the MDN screenshot -->
    <link href="https://fonts.googleapis.com/css?family=Open+Sans+Condensed:300|Sonsie+One"
          rel="stylesheet">

    <style>

        /* =========================
           GENERAL PAGE
        ========================= */

        * {
            box-sizing: border-box;
        }

        html {
            background-color: #ddddee;
            font-size: 10px;
        }

        body {
            width: 80%;
            min-width: 800px;
            margin: 0 auto;
            background-color: #ddddee;
        }


        /* =========================
           HEADINGS AND TEXT
        ========================= */

        h1,
        h2,
        h3 {
            font-family: "Sonsie One", cursive;
            color: #222;
        }

        p,
        li,
        input,
        label,
        table {
            font-family: "Open Sans Condensed", Arial, sans-serif;
            color: #222;
        }

        p,
        li,
        table {
            font-size: 1.6rem;
            line-height: 1.5;
        }
        /* =========================
           HEADER
        ========================= */

        header {
            padding: 15px 0 20px;
        }

        header h1 {
            margin: 0;
            text-align: center;

            font-size: 4rem;

            color: white;

            text-shadow:
                2px 2px 5px #555,
                3px 3px 8px #777;
        }


        /* =========================
           NAVIGATION
        ========================= */

        nav {
            height: 65px;

            background-color: white;

            display: flex;
            align-items: center;

            margin-bottom: 8px;
        }

        nav ul {
            flex: 2;

            display: flex;

            list-style: none;

            margin: 0;
            padding: 0;
        }

        nav li {
            flex: 1;

            text-align: center;
        }

        nav a {
            color: #222;

            text-decoration: none;

            text-transform: uppercase;

            font-size: 1.7rem;
        }

        nav a:hover {
            text-decoration: underline;
        }


        /* =========================
           SEARCH
        ========================= */

        .search {
            flex: 1;

            display: flex;

            padding: 0 15px;

            gap: 8px;
        }

        .search input[type="search"] {
            width: 170px;

            height: 30px;

            border: 1px solid #ddd;

            padding: 5px;

            font-size: 1.4rem;
        }

        .search input[type="submit"] {
            width: 65px;

            height: 30px;

            border: none;

            background-color: #333;

            color: white;

            cursor: pointer;

            font-size: 1.4rem;
        }

        .search input[type="submit"]:hover {
            background-color: #111;
        }
