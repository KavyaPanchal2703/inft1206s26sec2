<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Story Generator</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Random Story Generator</h1>

    <div>
        <label for="custom-name">Enter custom name:</label>
        <input id="custom-name" type="text">
    </div>

    <fieldset>
        <legend>Choose locale:</legend>

        <label for="us">US</label>
        <input id="us" type="radio" name="uk-us" checked>

        <label for="uk">UK</label>
        <input id="uk" type="radio" name="uk-us">
    </fieldset>

    <button class="generate">Generate random story</button>

    <p class="story"></p>

    <script src="script.js"></script>

</body>
