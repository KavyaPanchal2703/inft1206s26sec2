<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Story Generator</title>
</head>

<body>

    <h1>Random Story Generator</h1>

    <label>
        Enter your name:
        <input id="custom-name" type="text">
    </label>

    <br><br>

    <button class="generate">Generate Story</button>

    <br><br>

    <label>
        <input id="uk" type="checkbox">
        Use UK units
    </label>

    <p class="story" style="visibility:hidden;"></p>


    <!-- Connect JavaScript -->
    <script src="script.js"></script>

</body>
</html>
